<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学术 Markdown 排版工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* =========================================================
   全局 UI
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  background: #eef1f5;
  color: #1f2328;
}

/* ---------- 顶栏 ---------- */
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 50px;
  background: #fff; border-bottom: 1px solid #dde3ea;
  flex-shrink: 0; position: relative; z-index: 200;
}
.brand { font-weight: 600; font-size: 15px; letter-spacing: .3px; user-select: none; }
.brand span { color: #9aa4b2; margin: 0 4px; }
.spacer { flex: 1; }

button {
  font: inherit; padding: 6px 14px; border-radius: 6px;
  border: 1px solid #d3dae3; background: #fff; color: #24292f;
  cursor: pointer; white-space: nowrap; line-height: 1.4;
  transition: background .15s, border-color .15s, box-shadow .15s;
}
button:hover { background: #f3f5f8; border-color: #b8c2ce; }
button:active { transform: translateY(1px); }
button.primary {
  background: #2f6fed; border-color: #2f6fed; color: #fff;
  box-shadow: 0 1px 2px rgba(47,111,237,.3);
}
button.primary:hover { background: #2559c9; border-color: #2559c9; }

/* ---------- 设置面板 ---------- */
.settings-panel {
  position: fixed; top: 58px; right: 14px; width: 300px;
  background: #fff; border: 1px solid #dfe5ec; border-radius: 10px;
  box-shadow: 0 8px 28px rgba(20,30,50,.16);
  padding: 14px 16px 16px; z-index: 300; font-size: 13px;
}
.settings-panel h4 {
  margin: 0 0 12px; font-size: 13px; color: #5b6472;
  font-weight: 600; letter-spacing: .5px;
}
.settings-panel label {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 11px; color: #333a44;
}
.settings-panel label > span:first-child { flex: 0 0 70px; color: #5b6472; }
.settings-panel input[type=range] { flex: 1; accent-color: #2f6fed; }
.settings-panel input[type=checkbox] { accent-color: #2f6fed; width: 15px; height: 15px; }
.settings-panel select {
  flex: 1; font: inherit; padding: 4px 6px;
  border: 1px solid #d3dae3; border-radius: 5px; background: #fff;
}
.val { min-width: 44px; text-align: right; color: #6b7480; font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: #edf0f4; margin: 4px 0 12px; }

/* ---------- 工作区 ---------- */
.workspace { flex: 1; display: flex; min-height: 0; }

.editor-pane {
  width: 40%; min-width: 300px; max-width: 720px;
  display: flex; flex-direction: column;
  border-right: 1px solid #dde3ea; background: #fafbfc;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between;
  height: 32px; padding: 0 14px;
  font-size: 12px; color: #8b95a3; letter-spacing: .4px;
  border-bottom: 1px solid #e8ecf1; background: #f5f7fa; flex-shrink: 0;
}
.stat { font-variant-numeric: tabular-nums; }

#editor {
  flex: 1; border: none; outline: none; resize: none;
  padding: 18px 20px 40px;
  font-family: "JetBrains Mono", "SF Mono", Consolas, "Cascadia Code", monospace;
  font-size: 13px; line-height: 1.75; background: transparent;
  color: #24292e; tab-size: 2;
}

.preview-pane {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 26px 0 80px; background: #e6e9ee;
}

#pages {
  display: flex; flex-direction: column; align-items: center;
  gap: 22px; transform-origin: top center;
}

/* =========================================================
   纸张（分页）
   ========================================================= */
.page {
  position: relative;
  width: 210mm;
  height: 297mm;
  padding: 20mm;
  background: #fff;
  box-shadow: 0 3px 16px rgba(20,30,50,.14);
  overflow: hidden;
  font-family: var(--doc-font, serif);
  font-size: var(--doc-size, 15px);
  line-height: var(--doc-lh, 1.55);
  color: #16191d;
  text-align: justify;
  text-justify: inter-ideograph;
  overflow-wrap: break-word;
  word-break: break-word;
  -webkit-font-smoothing: antialiased;
  flex: 0 0 auto;
}
.page.page-tall { height: auto; min-height: 297mm; }
.page.page-tall .page-body { height: auto; }

.page-body { height: 100%; overflow: hidden; }

/* ---------- 页眉 ---------- */
.page-header {
  position: absolute;
  top: 9mm; left: 20mm; right: 20mm;
  text-align: center;
  font-size: 10px;
  line-height: 1.5;
  color: #6b7480;
  padding-bottom: 1.6mm;
  border-bottom: 1px solid #e6eaef;
  letter-spacing: .02em;
}
.page-header:empty { display: none; }

/* ---------- 页脚 ---------- */
.page-footer {
  position: absolute;
  left: 20mm; right: 20mm; bottom: 10mm;
  font-size: 10.5px;
  line-height: 1.5;
  color: #6b7480;
  text-align: center;
}
.pf-num {
  display: inline-block;
  font-variant-numeric: tabular-nums;
  letter-spacing: .03em;
}
.pf-text {
  position: absolute; left: 0; bottom: 0;
  text-align: left; max-width: 60%;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.pf-text:empty { display: none; }
.page-footer:empty { display: none; }

/* ---------- 封面 ---------- */
.cover {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 24%;
  text-align: center;
}
.cover-title {
  font-size: 2.6em;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: .08em;
  margin: 0 0 .4em;
  max-width: 92%;
}
.cover-author {
  font-size: 1.35em;
  margin-top: 6.5em;
  letter-spacing: .12em;
}
.cover-note {
  font-size: 1.02em;
  margin-top: 1.8em;
  color: #40454d;
  line-height: 2;
  letter-spacing: .02em;
  max-width: 84%;
}

/* =========================================================
   文档正文排版（.doc-body 同时用于 stage 和 page-body）
   ========================================================= */
.doc-body { font-family: var(--doc-font, serif); }

/* ---------- 标题 ---------- */
.doc-body h1 {
  font-size: 1.5em; font-weight: 700; text-align: center;
  margin: 1.4em 0 .9em; line-height: 1.4; letter-spacing: .02em;
}
.doc-body h1:first-child { margin-top: 0; }
.doc-body h2 { font-size: 1.22em; font-weight: 700; margin: 1.3em 0 .55em; line-height: 1.45; }
.doc-body h3 { font-size: 1.08em; font-weight: 700; margin: 1.1em 0 .45em; line-height: 1.45; }
.doc-body h4, .doc-body h5, .doc-body h6 { font-size: 1em; font-weight: 700; margin: .9em 0 .4em; }
.doc-body h1 + h2, .doc-body h2 + h3 { margin-top: .5em; }

/* ---------- 正文块 ---------- */
.doc-body p { margin: .48em 0; }
.doc-body ul, .doc-body ol { margin: .5em 0; padding-left: 1.9em; }
.doc-body li { margin: .16em 0; }
.doc-body li > p { margin: .2em 0; }

.doc-body blockquote {
  margin: .7em 0; padding: .15em 0 .15em 1.05em;
  border-left: 3px solid #cbd3dd; color: #4a5561;
}
.doc-body blockquote > :first-child { margin-top: 0; }
.doc-body blockquote > :last-child { margin-bottom: 0; }

.doc-body hr { border: none; border-top: 1px solid #dfe4ea; margin: 1.5em 0; }
.doc-body a { color: #2456c8; text-decoration: none; border-bottom: 1px solid rgba(36,86,200,.3); }
.doc-body img { max-width: 100%; height: auto; display: block; margin: .8em auto; }

/* ---------- 代码 ---------- */
.doc-body code {
  font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
  font-size: .87em; background: #f2f4f7;
  padding: .12em .38em; border-radius: 3px; color: #b1306a;
}
.doc-body pre {
  background: #f7f8fa; border: 1px solid #e4e8ee; border-radius: 6px;
  padding: .75em 1em; overflow-x: auto;
  font-size: .84em; line-height: 1.6; margin: .75em 0; text-align: left;
}
.doc-body pre code {
  background: none; padding: 0; font-size: 1em; color: #24292e; white-space: pre-wrap;
}

/* ---------- 表格 ---------- */
.doc-body table { border-collapse: collapse; margin: .8em auto; font-size: .93em; max-width: 100%; }
.doc-body th, .doc-body td {
  border: 1px solid #ccd3dc; padding: .32em .75em; text-align: left; line-height: 1.5;
}
.doc-body th { background: #f5f7f9; font-weight: 600; }
.doc-body tr { break-inside: avoid; }

/* ---------- 数学 ---------- */
.doc-body .katex { font-size: 1.03em; }
.doc-body .katex-display {
  margin: .75em 0; padding: 0 .2em;
  overflow-x: auto; overflow-y: hidden; text-align: center;
}
.doc-body .math-display { text-align: center; margin: .75em 0; }

/* ---------- 自定义条目 ---------- */
.z-item {
  display: grid;
  grid-template-columns: var(--z-head-w, max-content) minmax(0, 1fr);
  column-gap: 1.15em;
  align-items: start;
  margin: .58em 0;
  break-inside: avoid;
  page-break-inside: avoid;
}
.z-head {
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  color: #101317;
}
.z-body { min-width: 0; }
.z-body > :first-child { margin-top: 0; }
.z-body > :last-child { margin-bottom: 0; }
.z-body p { margin: .28em 0; }
.z-body .z-item { margin: .35em 0; }
.z-body .z-head { font-weight: 700; }

/* ★ 例题 / 点拨：完整方框 + 浅灰底（不越界，不被裁剪） */
.z-item[data-ztype="zExample"],
.z-item[data-ztype="zTip"] {
  border: 1px solid #d5dce6;
  border-radius: 5px;
  background: #f7f8fa;
  padding: .62em .9em;
  margin: .75em 0;
  column-gap: 1em;
  break-inside: avoid;
  page-break-inside: avoid;
}

/* =========================================================
   目录
   ========================================================= */
.toc-heading {
  font-size: 1.35em; font-weight: 700; text-align: center;
  margin: .2em 0 1.3em; letter-spacing: .5em; text-indent: .5em;
}
.toc-row {
  display: flex; align-items: baseline;
  line-height: 1.95; font-size: .96em;
}
.toc-text { flex: 0 1 auto; max-width: 88%; }
.toc-dots {
  flex: 1 1 auto; min-width: 1.5em;
  border-bottom: 1px dotted #b9c1cb;
  margin: 0 .45em;
  transform: translateY(-.28em);
}
.toc-page {
  flex: 0 0 auto; min-width: 1.8em; text-align: right;
  font-variant-numeric: tabular-nums; color: #333;
}
.toc-row.is-item .toc-text { color: #444c56; }

/* =========================================================
   离屏测量容器
   ========================================================= */
#stage {
  position: absolute;
  left: -30000px; top: 0;
  width: 170mm;
  font-family: var(--doc-font, serif);
  font-size: var(--doc-size, 15px);
  line-height: var(--doc-lh, 1.55);
  color: #16191d;
  text-align: justify;
  text-justify: inter-ideograph;
  overflow-wrap: break-word;
  word-break: break-word;
  visibility: hidden;
  pointer-events: none;
}
#paginator {
  position: absolute;
  left: -30000px; top: 0;
  width: 210mm;
  visibility: hidden;
  pointer-events: none;
}

/* =========================================================
   打印 / 导出 PDF
   ========================================================= */
@page { size: A4; margin: 0; }

@media print {
  html, body {
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
    display: block !important;
  }
  .no-print, .toolbar, .editor-pane, .settings-panel { display: none !important; }
  .workspace { display: block !important; height: auto !important; overflow: visible !important; }
  .preview-pane {
    overflow: visible !important;
    padding: 0 !important;
    height: auto !important;
    background: #fff !important;
  }
  #pages {
    display: block !important;
    gap: 0 !important;
    transform: none !important;
    margin: 0 !important;
  }
  .page {
    margin: 0 !important;
    box-shadow: none !important;
    break-after: page;
    page-break-after: always;
    overflow: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .page.page-tall { height: auto; }
  .doc-body h1, .doc-body h2, .doc-body h3, .doc-body h4 {
    break-after: avoid;
    page-break-after: avoid;
  }
  .doc-body table, .doc-body figure, .doc-body blockquote { break-inside: avoid; }
  .doc-body .katex-display { overflow: visible !important; }
  .doc-body a { color: inherit; border: none; }
}

/* 窄屏适配 */
@media (max-width: 900px) {
  .editor-pane { display: none; }
}
</style>
</head>
<body>

<header class="toolbar no-print">
  <div class="brand">学术 Markdown <span>·</span> 排版工具</div>
  <div class="spacer"></div>
  <button id="btnSample">示例文档</button>
  <button id="btnOpen">打开 .md</button>
  <button id="btnExport">导出 HTML</button>
  <button id="btnPrint" class="primary">打印 / 保存 PDF</button>
  <button id="btnSettings" title="排版设置">⚙ 设置</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
</header>

<main class="workspace">
  <section class="editor-pane no-print">
    <div class="pane-head">
      <span>Markdown 源文件</span>
      <span class="stat" id="stat"></span>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <section class="preview-pane">
    <div id="pages"></div>
  </section>
</main>

<div class="settings-panel" id="settingsPanel" hidden>
  <h4>版式</h4>
  <label><span>正文字号</span><input type="range" id="setSize" min="12" max="18" step="0.5" value="15"><span class="val" id="setSizeVal">15px</span></label>
  <label><span>行　　高</span><input type="range" id="setLH" min="1.2" max="2" step="0.05" value="1.55"><span class="val" id="setLHVal">1.55</span></label>
  <label><span>字　　体</span>
    <select id="setFont">
      <option value="serif">衬线（宋体 / Times）</option>
      <option value="sans">无衬线（黑体 / Helvetica）</option>
    </select>
  </label>

  <div class="sep"></div>
  <h4>自动生成</h4>
  <label><span>封　　面</span><input type="checkbox" id="setCover" checked><span style="color:#5b6472">zTitle 存在时生成</span></label>
  <label><span>目　　录</span><input type="checkbox" id="setTOC" checked><span style="color:#5b6472">生成目录页</span></label>
  <label><span></span><input type="checkbox" id="setTOCItems"><span style="color:#5b6472">目录含定义 / 定理等</span></label>
  <label><span>页眉页脚</span><input type="checkbox" id="setHF" checked><span style="color:#5b6472">zHeader / zFooter</span></label>
  <label><span>页　　码</span><input type="checkbox" id="setPageNum" checked><span style="color:#5b6472">目录罗马·正文阿拉伯</span></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script>
(function () {
'use strict';

/* =========================================================
   常量
   ========================================================= */
const Z_ITEM_TYPES = {
  zDefinition: '定义',
  zTheorem:    '定理',
  zCorollary:  '推论',
  zLemma:      '引理',
  zExample:    '例',
  zTip:        '点拨'
};

const Z_META_TAGS = {
  zTitle:  'title',
  zAuthor: 'author',
  zNote:   'note',
  zHeader: 'header',
  zFooter: 'footer'
};

const ALL_TAGS = Object.keys(Z_META_TAGS).concat(Object.keys(Z_ITEM_TYPES));
const Z_RE = new RegExp('<(\\/)?(' + ALL_TAGS.join('|') + ')\\b([^>]*)>', 'g');

const SERIF = '"Latin Modern Roman","Times New Roman","Songti SC","SimSun","STSong",serif';
const SANS  = '"Helvetica Neue",Helvetica,"PingFang SC","Microsoft YaHei",Arial,sans-serif';

/* =========================================================
   工具
   ========================================================= */
const $ = id => document.getElementById(id);

const editor      = $('editor');
const pagesEl     = $('pages');
const previewPane = document.querySelector('.preview-pane');
const statEl      = $('stat');

const escapeHtml = s => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* 1mm = 多少 CSS px（实测） */
const MM = (() => {
  const d = document.createElement('div');
  d.style.cssText = 'width:100mm;height:0;position:absolute;left:-99999px;top:0;visibility:hidden';
  document.body.appendChild(d);
  const px = d.getBoundingClientRect().width / 100;
  d.remove();
  return px || 3.7795;
})();

/* 罗马数字（小写） */
const ROMAN = [[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],
               [50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
function romanize(n) {
  let s = '';
  for (const [v, sym] of ROMAN) { while (n >= v) { s += sym; n -= v; } }
  return s || 'i';
}

/* 读取属性值（大小写不敏感，支持单双引号） */
function getAttr(attrs, name) {
  if (!attrs) return null;
  let m = new RegExp(name + '\\s*=\\s*"([^"]*)"', 'i').exec(attrs);
  if (m) return m[1];
  m = new RegExp(name + "\\s*=\\s*'([^']*)'", 'i').exec(attrs);
  return m ? m[1] : null;
}

/* 行内 Markdown */
function mdInline(s) {
  if (!s) return '';
  try { return window.marked ? marked.parseInline(s) : escapeHtml(s); }
  catch (e) { return escapeHtml(s); }
}

/* =========================================================
   状态
   ========================================================= */
let zStore = Object.create(null);
let zSeq = 0;

const settings = {
  size: 15,
  lh: 1.55,
  font: 'serif',
  cover: true,
  toc: true,
  tocItems: false,
  hf: true,
  pageNum: true
};

/* =========================================================
   marked 扩展：保护数学公式
   ========================================================= */
function setupMarked() {
  if (!window.marked) return;

  const mathBlock = {
    name: 'mathBlock', level: 'block',
    start(src) { const i = src.indexOf('$$'); return i < 0 ? undefined : i; },
    tokenizer(src) {
      const m = /^\$\$([\s\S]+?)\$\$/.exec(src);
      if (m) return { type: 'mathBlock', raw: m[0], text: m[1] };
    },
    renderer(tok) { return '<div class="math-display">$$' + tok.text + '$$</div>'; }
  };

  const mathInline = {
    name: 'mathInline', level: 'inline',
    start(src) { const i = src.indexOf('$'); return i < 0 ? undefined : i; },
    tokenizer(src) {
      const m = /^\$([^\$\n]+?)\$/.exec(src);
      if (m && m[1].trim()) return { type: 'mathInline', raw: m[0], text: m[1] };
    },
    renderer(tok) { return '$' + tok.text + '$'; }
  };

  marked.use({ gfm: true, breaks: false, pedantic: false, extensions: [mathBlock, mathInline] });
}

/* =========================================================
   1. 解析 z 标签 → 节点树
   ========================================================= */
function parseZ(src) {
  const root = { type: 'root', children: [] };
  const stack = [root];
  Z_RE.lastIndex = 0;
  let last = 0, m;

  while ((m = Z_RE.exec(src)) !== null) {
    const text = src.slice(last, m.index);
    if (text) stack[stack.length - 1].children.push({ type: 'text', value: text });
    last = Z_RE.lastIndex;

    if (!m[1]) {
      const node = { type: 'z', tag: m[2], attrs: m[3] || '', children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    } else if (stack.length > 1) {
      stack.pop();
    }
  }
  const tail = src.slice(last);
  if (tail) stack[stack.length - 1].children.push({ type: 'text', value: tail });
  return root;
}

/* 拼接节点内的纯文本 */
function rawText(node) {
  let s = '';
  for (const c of node.children) {
    if (c.type === 'text') s += c.value;
    else s += rawText(c);
  }
  return s.trim();
}

/* =========================================================
   2. 抽取封面 / 页眉页脚信息（并从正文流中移除）
   ========================================================= */
function extractMeta(root) {
  const meta = { title: '', author: '', note: '', header: '', footer: '' };
  const seen = Object.create(null);

  function walk(node) {
    if (!node.children) return;
    node.children = node.children.filter(c => {
      if (c.type === 'z' && Z_META_TAGS[c.tag]) {
        const key = Z_META_TAGS[c.tag];
        if (!seen[key]) {
          seen[key] = true;
          meta[key] = rawText(c);
        }
        return false;
      }
      walk(c);
      return true;
    });
  }
  walk(root);
  return meta;
}

/* =========================================================
   3. 节点树 → Markdown（z 条目变成占位 div）
   ========================================================= */
function serializeNodes(node) {
  let out = '';
  for (const c of node.children) {
    if (c.type === 'text') {
      out += c.value;
    } else {
      const id = 'z' + (zSeq++);
      zStore[id] = c;
      out += '\n\n<div class="zblock" data-zid="' + id + '"></div>\n\n';
    }
  }
  return out;
}

/* =========================================================
   4. HTML 块内嵌 Markdown 的处理
   ========================================================= */
const HTML_BLOCK_TAGS =
  'div|section|article|aside|details|summary|figure|figcaption|header|footer|' +
  'main|nav|span|p|table|thead|tbody|tr|td|th|ul|ol|li|blockquote';

const MD_SIGNS = /(\*\*|__|~~|`|\$|\[[^\]]*\]\(|^\s*#{1,6}\s|^\s*[-*+]\s|^\s*\d+\.\s|^\s*>)/m;

function processHtmlBlocks(md) {
  if (!window.marked) return md;
  const re = new RegExp('<' + '(' + HTML_BLOCK_TAGS + ')\\b([^>]*)>([\\s\\S]*?)<\\/\\1>', 'gi');

  let prev = null, out = md, guard = 0;
  while (out !== prev && guard++ < 12) {
    prev = out;
    out = out.replace(re, (whole, tag, attrs, inner) => {
      if (!inner || !inner.trim()) return whole;
      if (/zblock|katex|class="katex/.test(inner)) return whole;
      if (!MD_SIGNS.test(inner)) return whole;
      let rendered;
      try { rendered = marked.parse(inner); } catch (e) { return whole; }
      return '<' + tag + (attrs || '') + '>' + rendered + '</' + tag + '>';
    });
  }
  return out;
}

/* =========================================================
   5. 构建 z 条目 DOM
   ========================================================= */
function buildZElement(node) {
  const wrap = document.createElement('div');
  wrap.className = 'z-item';
  wrap.dataset.ztype = node.tag;

  const desc = getAttr(node.attrs, 'Description');
  if (desc) wrap.dataset.zdesc = desc;

  const head = document.createElement('div');
  head.className = 'z-head';

  const body = document.createElement('div');
  body.className = 'z-body';

  const innerMd = serializeNodes(node);
  let innerHtml;
  try {
    innerHtml = window.marked ? marked.parse(processHtmlBlocks(innerMd)) : escapeHtml(innerMd);
  } catch (e) {
    innerHtml = escapeHtml(innerMd);
  }
  body.innerHTML = innerHtml;

  wrap.appendChild(head);
  wrap.appendChild(body);
  return wrap;
}

function expandZBlocks(root) {
  let guard = 0, ph;
  while ((ph = root.querySelector('.zblock')) && guard++ < 5000) {
    const node = zStore[ph.dataset.zid];
    if (!node) { ph.remove(); continue; }
    ph.replaceWith(buildZElement(node));
  }
}

/* =========================================================
   6. 自动编号
   —— 标题占用层级路径（如 1、1.2、1.2.3）
   —— 条目编号 = 当前标题路径 + 【该类型】在本标题下的独立序号
      例：标题 1.2 下 → 定义 1.2.1、定理 1.2.1、例 1.2.1、再一个定义 1.2.2
   ========================================================= */
function numberItems(root) {
  const nodes = root.querySelectorAll('h1,h2,h3,h4,h5,h6,.z-item');
  const hc = [];                        /* 标题层级计数 */
  const counters = Object.create(null); /* 按条目类型独立计数 */

  const resetCounters = () => {
    for (const k in counters) delete counters[k];
  };

  nodes.forEach(el => {
    if (/^H[1-6]$/.test(el.tagName)) {
      const d = +el.tagName[1];
      if (hc.length > d) hc.length = d;
      while (hc.length < d) hc.push(0);
      hc[d - 1] = (hc[d - 1] || 0) + 1;

      /* 进入新的标题，所有类型计数归零 */
      resetCounters();

      el.dataset.num = hc.filter(v => v > 0).join('.') || '1';
    } else {
      const tag = el.dataset.ztype || 'zItem';
      counters[tag] = (counters[tag] || 0) + 1;

      const path = hc.filter(v => v > 0);
      const prefix = path.join('.');
      const num = prefix ? prefix + '.' + counters[tag] : String(counters[tag]);

      el.dataset.num = num;
      el.dataset.level = String(path.length || 1);

      const head = el.querySelector(':scope > .z-head');
      if (head) {
        const name = Z_ITEM_TYPES[el.dataset.ztype] || '条目';
        const desc = el.dataset.zdesc;
        head.textContent = desc
          ? (name + ' ' + num + '（' + desc + '）')
          : (name + ' ' + num);
      }
    }
  });
}

/* =========================================================
   7. 数学公式
   ========================================================= */
function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  try {
    renderMathInElement(root, {
      delimiters: [
        { left: '$$',  right: '$$',  display: true  },
        { left: '\\[', right: '\\]', display: true  },
        { left: '\\(', right: '\\)', display: false },
        { left: '$',   right: '$',   display: false }
      ],
      throwOnError: false,
      errorColor: '#cc2222',
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
      macros: {
        '\\RR': '\\mathbb{R}', '\\NN': '\\mathbb{N}', '\\ZZ': '\\mathbb{Z}',
        '\\QQ': '\\mathbb{Q}', '\\CC': '\\mathbb{C}', '\\FF': '\\mathbb{F}',
        '\\dd': '\\mathrm{d}', '\\ee': '\\mathrm{e}'
      }
    });
  } catch (e) {
    console.warn('KaTeX 渲染出错：', e);
  }
}

/* =========================================================
   8. 离屏测量容器
   ========================================================= */
let stageEl = null;
function getStage() {
  if (!stageEl) {
    stageEl = document.createElement('div');
    stageEl.id = 'stage';
    stageEl.className = 'doc-body';
    document.body.appendChild(stageEl);
  }
  return stageEl;
}

/* 对齐所有条目标签宽度 */
function measureZHeads(root) {
  const heads = root.querySelectorAll('.z-head');
  if (!heads.length) return 0;

  document.documentElement.style.setProperty('--z-head-w', 'max-content');
  void root.offsetWidth;

  let max = 0;
  heads.forEach(h => { max = Math.max(max, h.offsetWidth); });
  return max;
}

/* =========================================================
   9. 页面工厂
   ========================================================= */
function makePage(kind) {
  const el = document.createElement('div');
  el.className = 'page';
  el.dataset.kind = kind;

  const header = document.createElement('div');
  header.className = 'page-header';

  const body = document.createElement('div');
  body.className = 'page-body doc-body';

  const footer = document.createElement('div');
  footer.className = 'page-footer';
  const ftext = document.createElement('span');
  ftext.className = 'pf-text';
  const fnum = document.createElement('span');
  fnum.className = 'pf-num';
  footer.appendChild(ftext);
  footer.appendChild(fnum);

  el.appendChild(header);
  el.appendChild(body);
  el.appendChild(footer);

  return { el, header, body, footer, ftext, fnum };
}

/* =========================================================
   10. 分页（把块级元素依次灌入页面）
   ========================================================= */
function flowInto(items, kind, host) {
  const pages = [];

  let page = makePage(kind);
  host.appendChild(page.el);
  pages.push(page);

  let body = page.body;
  let sealed = false;   /* 该页已被单个超高块撑高，后续内容另起一页 */

  const newPage = () => {
    page = makePage(kind);
    host.appendChild(page.el);
    pages.push(page);
    body = page.body;
    sealed = false;
  };

  const isOverflow = () => body.scrollHeight > body.clientHeight + 1;

  for (const item of items) {
    if (sealed) newPage();

    body.appendChild(item);

    if (!isOverflow()) continue;

    if (!sealed && body.children.length === 1) {
      /* 单个块本身高于一页：允许该页自动长高 */
      page.el.classList.add('page-tall');
      sealed = true;
    } else {
      body.removeChild(item);
      newPage();
      body.appendChild(item);
      if (isOverflow()) {
        page.el.classList.add('page-tall');
        sealed = true;
      }
    }
  }

  return pages;
}

/* =========================================================
   11. 页眉 / 页脚 / 页码
   ========================================================= */
function decoratePages(pages, kind, ctx) {
  pages.forEach((p, i) => {
    const n = i + 1;

    if (ctx.showHF) {
      if (ctx.header) p.header.innerHTML = mdInline(ctx.header);
      if (ctx.footer) p.ftext.innerHTML = mdInline(ctx.footer);
    }

    if (ctx.showPageNum) {
      p.fnum.textContent = kind === 'toc' ? romanize(n) : String(n);
    } else {
      p.fnum.textContent = '';
    }
  });
}

/* =========================================================
   12. 目录
   ========================================================= */
function buildTOCRows(pages) {
  const sel = settings.tocItems
    ? 'h1,h2,h3,h4,h5,h6,.z-item'
    : 'h1,h2,h3,h4,h5,h6';

  const rows = [];

  pages.forEach((p, idx) => {
    p.body.querySelectorAll(sel).forEach(el => {
      let level, text, isItem = false;

      if (/^H[1-6]$/.test(el.tagName)) {
        level = +el.tagName[1];
        text = (el.textContent || '').trim().replace(/\s+/g, ' ');
      } else {
        isItem = true;
        const head = el.querySelector(':scope > .z-head');
        text = head ? head.textContent.trim() : '';
        level = Math.min(6, (parseInt(el.dataset.level, 10) || 1) + 1);
      }

      if (!text) return;

      const row = document.createElement('div');
      row.className = 'toc-row' + (isItem ? ' is-item' : '');
      row.style.paddingLeft = ((level - 1) * 15) + 'px';

      const t = document.createElement('span');
      t.className = 'toc-text';
      t.textContent = text;

      const d = document.createElement('span');
      d.className = 'toc-dots';

      const pg = document.createElement('span');
      pg.className = 'toc-page';
      pg.textContent = String(idx + 1);

      row.appendChild(t);
      row.appendChild(d);
      row.appendChild(pg);
      rows.push(row);
    });
  });

  return rows;
}

function flowTOC(rows, host) {
  const pages = [];

  let page = makePage('toc');
  host.appendChild(page.el);
  pages.push(page);

  const heading = document.createElement('div');
  heading.className = 'toc-heading';
  heading.textContent = '目　录';
  page.body.appendChild(heading);

  let body = page.body;
  let sealed = false;

  const newPage = () => {
    page = makePage('toc');
    host.appendChild(page.el);
    pages.push(page);
    body = page.body;
    sealed = false;
  };

  const isOverflow = () => body.scrollHeight > body.clientHeight + 1;

  for (const row of rows) {
    if (sealed) newPage();

    body.appendChild(row);

    if (!isOverflow()) continue;

    if (!sealed && body.children.length === 1) {
      page.el.classList.add('page-tall');
      sealed = true;
    } else {
      body.removeChild(row);
      newPage();
      body.appendChild(row);
      if (isOverflow()) {
        page.el.classList.add('page-tall');
        sealed = true;
      }
    }
  }

  return pages;
}

/* =========================================================
   13. 封面
   ========================================================= */
function buildCover(meta) {
  const el = document.createElement('div');
  el.className = 'page cover-page';

  const inner = document.createElement('div');
  inner.className = 'cover';

  if (meta.title) {
    const t = document.createElement('div');
    t.className = 'cover-title';
    t.innerHTML = mdInline(meta.title);
    inner.appendChild(t);
  }
  if (meta.author) {
    const a = document.createElement('div');
    a.className = 'cover-author';
    a.innerHTML = mdInline(meta.author);
    inner.appendChild(a);
  }
  if (meta.note) {
    const n = document.createElement('div');
    n.className = 'cover-note';
    n.innerHTML = mdInline(meta.note);
    inner.appendChild(n);
  }

  el.appendChild(inner);
  return el;
}

/* =========================================================
   14. 主渲染流程
   ========================================================= */
function render() {
  if (!window.marked) {
    pagesEl.innerHTML = '<div style="color:#c00;padding:24px;font-size:14px">marked.js 未能加载，请检查网络后刷新页面。</div>';
    return;
  }

  zStore = Object.create(null);
  zSeq = 0;

  const src = editor.value;

  /* ① 解析自定义标签 */
  const tree = parseZ(src);
  const meta = extractMeta(tree);

  /* ② 序列化 → Markdown → HTML */
  let md = serializeNodes(tree);
  md = processHtmlBlocks(md);

  let html;
  try { html = marked.parse(md); }
  catch (e) { html = '<pre>' + escapeHtml(String(e)) + '</pre>'; }

  /* ③ 挂到离屏 stage */
  const stage = getStage();
  stage.innerHTML = html;

  /* ④ 展开条目占位符 */
  expandZBlocks(stage);

  /* ⑤ 自动编号 */
  numberItems(stage);

  /* ⑥ 渲染数学公式 */
  renderMath(stage);

  /* ⑦ 对齐条目标签宽度 */
  const headW = measureZHeads(stage);
  if (headW > 0) {
    document.documentElement.style.setProperty('--z-head-w', headW + 'px');
  }
  void stage.offsetWidth;

  /* ⑧ 取出顶层块，清空 stage */
  const items = Array.from(stage.children);
  stage.innerHTML = '';

  /* ⑨ 分页容器 */
  const host = document.createElement('div');
  host.id = 'paginator';
  document.body.appendChild(host);

  const ctx = {
    header: settings.hf ? meta.header : '',
    footer: settings.hf ? meta.footer : '',
    showHF: settings.hf,
    showPageNum: settings.pageNum
  };

  /* ⑩ 正文分页 */
  const bodyPages = flowInto(items, 'body', host);
  decoratePages(bodyPages, 'body', ctx);

  /* ⑪ 目录页 */
  let tocPages = [];
  if (settings.toc) {
    const tocRows = buildTOCRows(bodyPages);
    if (tocRows.length) {
      tocPages = flowTOC(tocRows, host);
      decoratePages(tocPages, 'toc', ctx);
    }
  }

  /* ⑫ 组装 */
  pagesEl.innerHTML = '';
  pagesEl.style.transform = '';
  pagesEl.style.marginBottom = '';

  let hasCover = false;
  if (settings.cover && (meta.title || meta.author || meta.note)) {
    pagesEl.appendChild(buildCover(meta));
    hasCover = true;
  }
  tocPages.forEach(p => pagesEl.appendChild(p.el));
  bodyPages.forEach(p => pagesEl.appendChild(p.el));

  /* ⑬ 清理离屏容器 */
  host.remove();

  /* ⑭ 统计 */
  const total = (hasCover ? 1 : 0) + tocPages.length + bodyPages.length;
  statEl.textContent = src.length + ' 字符 · ' + total + ' 页';

  requestAnimationFrame(fitPages);
}

/* =========================================================
   15. 纸张自适应缩放
   ========================================================= */
function fitPages() {
  const avail = previewPane.clientWidth - 56;
  const pageW = 210 * MM;
  const s = Math.min(1, avail / pageW);

  pagesEl.style.transformOrigin = 'top center';
  pagesEl.style.transform = s < 1 ? 'scale(' + s + ')' : '';

  const naturalH = pagesEl.offsetHeight;
  pagesEl.style.marginBottom = s < 1 ? (-(naturalH * (1 - s)) + 'px') : '0px';
}

/* =========================================================
   16. 应用排版设置
   ========================================================= */
function applySettings() {
  const root = document.documentElement;
  root.style.setProperty('--doc-size', settings.size + 'px');
  root.style.setProperty('--doc-lh', String(settings.lh));
  root.style.setProperty('--doc-font', settings.font === 'sans' ? SANS : SERIF);
  render();
}

function scheduleRender(delay) {

}

function download(filename, text) {
  const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[\\/:*?"<>|]/g, '_') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   19. 启动
   ========================================================= */
function init() {
  setupMarked();

  const root = document.documentElement;
  root.style.setProperty('--doc-size', settings.size + 'px');
  root.style.setProperty('--doc-lh', String(settings.lh));
  root.style.setProperty('--doc-font', SERIF);
  root.style.setProperty('--z-head-w', 'max-content');

  editor.value = SAMPLE;

  const go = () => {
    render();
    setTimeout(fitPages, 60);
    setTimeout(fitPages, 300);
  };

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(go);
  }
  go();
  setTimeout(render, 500);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
